# !!! Ejecutar docker compose --env-file .env.docker up --build !!!


services:
  app:
    build: .
    ports:
      - "${APP_PORT}:${APP_PORT}"
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT}
      APP_PUBLIC_DIR: /app/public
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ROLE_NAME}
      POSTGRES_PASSWORD: ${DB_PSW}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: