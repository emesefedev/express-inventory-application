# run:
# docker compose --env-file=.env.docker up -d 
services:
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  app:
    image: ghcr.io/emesefedev/express-inventory-application-app:latest
    expose:
      - "${APP_PORT}"
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT}
      APP_PUBLIC_DIR: /app/public
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.app.loadbalancer.server.port=${APP_PORT}
    networks:
      - proxy
      - internal

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ROLE_NAME}
      POSTGRES_PASSWORD: ${DB_PSW}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:
  traefik_letsencrypt:

networks:
  proxy:
    name: proxy
  internal:
    internal: true
